# ─────────────────────────────────────────────────────────────────────────────
# SEC-OPS 2.0 Nginx Reverse Proxy & Static Asset Gateway
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # Client body limit for hi-res waybill scans and snapshot uploads (25MB)
    client_max_body_size 25M;

    # Static UI React Application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # REST API Gateway forwarding to Backend Container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket Real-Time Telemetry & Alert Stream
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Media & Snapshots Proxy
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Health check for Nginx gateway
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}

