[project]
name = "retail-exit-backend"
version = "2.0.0"
description = "Smart Retail Exit Monitoring & Inventory Intelligence - Backend, Database & ML Inference Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "websockets>=13.1",
    "numpy>=1.26.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
